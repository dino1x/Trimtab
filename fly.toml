# fly launch --no-deploy --copy-config && fly deploy
app = "trimtab-vault"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  TRIMTAB_ONLINE = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
