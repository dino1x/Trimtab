[package]
name = "sandbox-fixtures"
description = "Test-only contract for near-workspaces: a NEP-141 token and a stand-in MPC signer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }
k256 = { workspace = true, features = ["ecdsa", "arithmetic"] }
sha3 = { workspace = true }
hex = { workspace = true }
